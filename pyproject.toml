[project]
name = "pyratapprox"
version = "0.1.0"
description = "Python interface for rational function approximation via Julia"
authors = [{name = "Toby Driscoll", email = "driscoll@udel.edu"}]
readme = "README.md"
requires-python = ">= 3.11"
license = {text = "MIT"}
keywords = ["rational approximation", "interpolation", "AAA", "numerical analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["juliacall>=0.9.35,<0.10", "cxregions>=0.1.6,<0.2", "hatch>=1.18.0,<2"]

[project.urls]
Homepage = "https://complexvariables.github.io/pyratapprox"
Documentation = "https://complexvariables.github.io/pyratapprox"
Repository = "https://github.com/complexvariables/pyratapprox"
Issues = "https://github.com/complexvariables/pyratapprox/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# Make Quarto/Jupyter use THIS environment for every `pixi run`. QUARTO_PYTHON
# pins Quarto's interpreter; JUPYTER_PATH puts the env's kernel registry first so
# the `python3` kernelspec is actually found here (it only exists in this env).
# Without JUPYTER_PATH, the lookup falls back to ~/Library/Jupyter/kernels (and a
# globally-active nb_conda_kernels), and Quarto starts the wrong kernel.
[tool.pixi.activation.env]
QUARTO_PYTHON = "$CONDA_PREFIX/bin/python"
JUPYTER_PATH = "$CONDA_PREFIX/share/jupyter"

[tool.pixi.pypi-dependencies]
pyratapprox = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
numpy = ">=2.5.2,<3"
ipykernel = ">=7.3.0,<8"
python = "3.13.*"
twine = ">=7.0.0,<8"

[tool.pixi.environments]
dev = ["doc", "test"]

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"

[tool.pixi.feature.doc.dependencies]
jupyter = ">=1.1.1,<2"
scipy = ">=1.18.0,<2"

[tool.pixi.feature.doc.pypi-dependencies]
quartodoc = ">=0.11.1, <0.12"
# quartodoc requires only "griffe>=0.33", but griffe 2.0 split into
# griffe/griffelib/griffecli and broke quartodoc's import shim. Pin to 1.x.
griffe = ">=1.5.1,<2"

[tool.pixi.feature.doc.tasks]
build-docs = "cd docs && quartodoc build && quarto render"

[dependency-groups]
doc = ["matplotlib>=3.11.1,<4"]
