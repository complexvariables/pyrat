name: Python package

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest "numpy>=2.4.0,<3"
        python -m pip install "juliacall>=0.9.31,<0.10"
        python -m pip install "cxregions>=0.1.4,<0.2"
        python -m pip install .
    - name: Verify Julia setup
      run: |
        python -c "import juliacall; print('Julia setup successful')"
    - name: Test with pytest
      run: |
        pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools_scm hatchling
    - name: Set version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Tagged version: $VERSION"  
    - name: Update version in pyproject.toml and setup.py
      run: |
        # Update version in pyproject.toml
        sed -i "s/version = \".*\"/version = \"$VERSION\"/" pyproject.toml
        # Update version in setup.py (handles both with and without spaces)
        sed -i "s/version=\"[^\"]*\"/version=\"$VERSION\"/" setup.py      
    - name: Commit version updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add pyproject.toml setup.py
        git commit -m "Update version to $VERSION [skip ci]" || echo "No changes to commit"
        git push origin HEAD:main || echo "Failed to push changes"
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m build
        twine upload dist/*
